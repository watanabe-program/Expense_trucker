<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf_8">
  <title></title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device_width, initial_scale=1">
  <script src="app.js" defer></script>

  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/input.css">
  <!-- Place favicon.ico in the root directory -->
  <!-- Googleフォント -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
    href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Zen+Old+Mincho:wght@400;500;600;700;900&display=swap"
    rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@100;300;400;500;700;800;900&display=swap" rel="stylesheet">



  <meta name="theme-color" content="#fafafa">
</head>


<body>
    <div id="dialog">
      <div class="overlay">
        <div class="confirm_card">
          <p class="confirm_text">本当に削除してよろしいですか？</p>
          
          <div class="confirm_buttons">
            <a href="edit.html" class="btn btn_back ">戻る</a>
            <a href="list.html" class="btn btn_delete">削除</a>
          </div>
        </div>
      </div>
    </div>
    <main>
        <div id = "app">
            <div class="input">
                <div class="container">
                    <a href="index.html" class="top_back btn btn_back ">戻る</a>
                    <div class="header">
                        <h1 class="title">支出編集</h1>
                    </div>
                    <div class="form_area">
                        <div class="input_group">
                            <div class="label_row">
                                <span class="label_text">費用名</span>
                                <span class="required_tag">必須</span>
                            </div>
                            <input type="text" class="input_field" placeholder="例：食費">
                        </div>
                        <div class="input_group">
                            <div class="label_row">
                                <span class="label_text">支払日時</span>
                                <span class="required_tag">必須</span>
                            </div>
                            <input type="date" class="input_field">
                        </div>
                        <div class="input_group">
                            <div class="label_row">
                                <span class="label_text">金額</span>
                                <span class="required_tag">必須</span>
                            </div>
                            <div class="amount_row">
                                <input type="number" class="input_field" placeholder="0">
                                <span class="currency">円</span>
                            </div>
                        </div>
                        <div class="input_group">
                            <div class="label_row">
                                <span class="label_text">支払方法</span>
                            </div>
                            <select class="input_field">
                                <option value="">選択してください</option>
                                <option value="cash">現金</option>
                                <option value="card">クレジットカード</option>
                                <option value="qr">QR決済</option>
                            </select>
                        </div>
                        <div class="input_group">
                            <div class="label_row">
                                <span class="label_text">場所</span>
                            </div>
                            <input type="text" class="input_field" placeholder="例：スーパー">
                        </div>
                        <div class="button_group">
                          <button class="input_submit btn btn_delete"><a href="input_confirm.html">削除</a></button>
                          <button class="input_submit btn btn_submit"><a href="input_confirm.html">編集</a></button>
                        </div>
                        </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
